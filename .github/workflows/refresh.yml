name: Refresh address data

# Weekly: if the National Address Database download changed, build one file per state. What happens next depends on
# the mode (Erik chose option C on 2026-11-02):
#   - a scheduled run builds and creates a DRAFT release, then opens an issue telling the owner it is waiting; nothing
#     is public until the owner publishes the draft (leave "Set as the latest release" ticked);
#   - if the repository variable PUBLISH_ENABLED is exactly "true", a scheduled run publishes straight away instead
#     (automatic publishing, off by default);
#   - a manual run is a dry run unless "dry_run" is unchecked: then it publishes, or creates a draft when "draft" is
#     ticked (to test the draft path).
# A draft that is already waiting stops further scheduled builds, so drafts do not pile up.
# Uses no secrets beyond the built-in GITHUB_TOKEN, which only the release and issue steps use.

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and report, publish nothing"
        type: boolean
        default: true
      draft:
        description: "With dry_run unchecked: create a draft release (and the issue) instead of publishing"
        type: boolean
        default: false
      force:
        description: "Build even if the NAD ETag is unchanged"
        type: boolean
        default: false
      units:
        description: "Tile format v2: add unit lists for multi-unit buildings (Erik chose on by default, 2026-11-02)"
        type: boolean
        default: true

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Socrata's download URL for the NAD dataset; confirm it with a manual HEAD before the first real run.
  NAD_URL: https://data.transportation.gov/download/fc2s-wawr/application%2Fzip

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write # create the release; only the release and issue steps use the token
      issues: write # tell the owner a draft is waiting
    steps:
      - name: Decide what this run may do
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          DRAFT_INPUT: ${{ inputs.draft }}
          PUBLISH_ENABLED: ${{ vars.PUBLISH_ENABLED }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ "$DRY_INPUT" = "true" ]; then mode=dry
            elif [ "$DRAFT_INPUT" = "true" ]; then mode=draft
            else mode=publish; fi
          elif [ "$PUBLISH_ENABLED" = "true" ]; then
            mode=publish
          else
            mode=draft
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Compare the NAD ETag with the last release
        id: etag
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # -L follows the redirect to the file store; the last etag header belongs to the real file.
          curl -sIL --fail --retry 3 "$NAD_URL" > headers.txt
          etag="$(grep -i '^etag:' headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')"
          length="$(grep -i '^content-length:' headers.txt | tail -1 | cut -d' ' -f2 | tr -d '\r')"
          [ -n "$etag" ] || { echo "NAD answered without an ETag"; exit 1; }
          previous=""
          if gh release view --json tagName >/dev/null 2>&1; then
            previous="$(gh release download --pattern index.json --output - 2>/dev/null | jq -r '.nadEtag // ""' || true)"
          fi
          changed=false
          if [ "$etag" != "$previous" ] || [ "$FORCE" = "true" ]; then changed=true; fi
          # A draft that is already waiting is the owner's to publish: do not build another one each week.
          if [ "$EVENT" = "schedule" ] && [ "$changed" = "true" ]; then
            waiting="$(gh release list --json isDraft --jq 'map(select(.isDraft)) | length' 2>/dev/null || echo 0)"
            if [ "$waiting" -gt 0 ]; then
              changed=false
              echo "A draft release is already waiting to be published; not building another." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          {
            echo "etag=$etag"
            echo "length=$length"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "NAD ETag: $etag ($length bytes); last release: ${previous:-none}; build needed: $changed"

      - name: Install 7-Zip
        if: steps.etag.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip
          # The Ubuntu package installs the binary as 7z; the scripts call it 7zz (the zip uses Deflate64, which unzip
          # cannot read).
          command -v 7zz || sudo ln -s "$(command -v 7z)" /usr/local/bin/7zz

      - name: Download NAD
        if: steps.etag.outputs.changed == 'true'
        env:
          EXPECTED: ${{ steps.etag.outputs.length }}
        run: |
          set -euo pipefail
          curl -sL --fail --retry 5 --retry-all-errors --retry-delay 20 -o "$RUNNER_TEMP/nad.zip" "$NAD_URL"
          actual="$(stat -c %s "$RUNNER_TEMP/nad.zip")"
          echo "downloaded $actual bytes (expected ${EXPECTED:-unknown})"
          # The host sends no Content-Length for this download (the length arrives as 0), so only a real length is checked.
          if [ "${EXPECTED:-0}" -gt 0 ] && [ "$actual" != "$EXPECTED" ]; then echo "size mismatch"; exit 1; fi
          [ "$actual" -gt 1000000000 ] || { echo "download too small to be the NAD zip"; exit 1; }
          df -h /

      - name: Build the per-state files
        id: build
        if: steps.etag.outputs.changed == 'true'
        env:
          # A scheduled run has no inputs, so it takes the default: unit lists on.
          UNITS: ${{ github.event_name == 'schedule' && 'true' || inputs.units }}
          ETAG: ${{ steps.etag.outputs.etag }}
          DELETE_ZIP: "1" # free 8.5 GB as soon as the split is done
        run: |
          set -euo pipefail
          entry="$(7zz l -ba "$RUNNER_TEMP/nad.zip" | awk '{print $NF}' | grep -E 'TXT/.*\.txt$' | head -1)"
          number="$(printf '%s' "$entry" | grep -oE 'r[0-9]+' | head -1 || true)"
          release="NAD ${number:-$(date -u +%Y%m%d)}"
          tag="nad-${number:-$(date -u +%Y%m%d)}-$(date -u +%Y%m%d)"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/"
          flag=()
          if [ "$UNITS" = "true" ]; then flag=(--units); fi
          scripts/build_all.sh "$RUNNER_TEMP/nad.zip" "$RUNNER_TEMP/out" "$release" "$ETAG" "$base_url" "${flag[@]}"
          {
            echo "release=$release"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Check the build
        if: steps.etag.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out/tiles"
          jq -e '.schema == 1 and (.states | length) >= 40' index.json >/dev/null \
            || { echo "index.json failed its checks (schema, or fewer than 40 states)"; exit 1; }
          too_big="$(find . -name '*.pmtiles' -size +2000M)"
          [ -z "$too_big" ] || { echo "over the 2 GiB release asset limit: $too_big"; exit 1; }
          {
            echo "### Address data build"
            echo ""
            echo "| State | Addresses | MB |"
            echo "| --- | ---: | ---: |"
            jq -r '.states[] | "| \(.code) | \(.addressCount) | \(.bytes / 1048576 | floor) |"' index.json
            echo ""
            echo "States with no rows: $(jq -r '.statesWithoutRows | join(", ")' index.json)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unit list statistics (counts only, no addresses)
        if: steps.etag.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 -I scripts/unit_stats.py "$RUNNER_TEMP"/out/tiles/*.pmtiles | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create the release (published, or a draft for the owner to publish)
        id: release
        if: steps.etag.outputs.changed == 'true' && steps.mode.outputs.mode != 'dry'
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
          RELEASE: ${{ steps.build.outputs.release }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out/tiles"
          notes="Built from the USDOT National Address Database ($RELEASE). Not for use as a mailing list. See index.json for coverage and the notice."
          if [ "$MODE" = "draft" ]; then
            # A draft is invisible to the public until the owner publishes it (leave "Set as the latest release" ticked).
            gh release create "$TAG" ./*.pmtiles index.json \
              --repo "$GITHUB_REPOSITORY" --title "$RELEASE" --draft --notes "$notes"
          else
            # --latest makes this the release behind /releases/latest/download/index.json: the pointer the app follows.
            gh release create "$TAG" ./*.pmtiles index.json \
              --repo "$GITHUB_REPOSITORY" --title "$RELEASE" --latest --notes "$notes"
          fi

      - name: Tell the owner a draft is waiting
        if: steps.etag.outputs.changed == 'true' && steps.mode.outputs.mode == 'draft'
        continue-on-error: true # the release is already created; a missing issue must not fail the run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.build.outputs.release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          states="$(jq -r '.states | length' "$RUNNER_TEMP/out/tiles/index.json")"
          without="$(jq -r '.statesWithoutRows | join(", ")' "$RUNNER_TEMP/out/tiles/index.json")"
          gh issue create --repo "$GITHUB_REPOSITORY" --title "New address data ready to publish: $RELEASE" --body "$(cat <<EOF
          A new National Address Database release was built and saved as a **draft** release named \`$RELEASE\`. Nothing is public until you publish it.

          - States with data: $states. States with no rows: $without.
          - The build summary (per-state counts and sizes, unit-list statistics) is in the run: $RUN_URL
          - To make it live: open Releases, open the draft, check the state counts against the last release, and press Publish with "Set as the latest release" ticked.
          - To discard it: delete the draft.
          EOF
          )"

      - name: Dry run summary
        if: steps.mode.outputs.mode == 'dry'
        run: echo "Dry run, nothing was published." | tee -a "$GITHUB_STEP_SUMMARY"
