name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # major tag; pin to a full commit SHA before the first real publish
      - run: python3 -I scripts/test_nad_tiles.py
      - run: shellcheck scripts/*.sh
