name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -I scripts/test_nad_tiles.py
      - run: scripts/test_unique_tag.sh
      - run: scripts/test_sign_index.sh
      - run: shellcheck scripts/*.sh
